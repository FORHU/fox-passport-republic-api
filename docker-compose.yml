# docker-compose.yml - Using Dockerfile for faster builds

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxpassportrepublic-backend
    working_dir: /usr/src/app
    volumes:
      # Mount source code for hot reload
      - ./src:/usr/src/app/src
      - ./prisma:/usr/src/app/prisma
      # Preserve node_modules in container
      - /usr/src/app/node_modules
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://:myredispassword@redis:6379
      - MONGODB_URL=mongodb://mongo:27017/staging
      - NODE_ENV=development
      - PORT=8080
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: foxpassportrepublic-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: staging
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: foxpassportrepublic-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "myredispassword"]
    volumes:  
      - redis-data:/data
    networks:
      - app-network

volumes:
  mongo-data:
  redis-data:

networks:
  app-network:
    driver: bridge