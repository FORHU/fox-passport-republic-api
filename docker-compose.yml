services:
  postgres:
    image: postgres:15
    container_name: local_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: myadmin
      POSTGRES_DB: foxpassportrepublic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: local_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uno_api
    depends_on:
      - postgres
      - redis
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:myadmin@postgres:5432/foxpassportrepublic
      - REDIS_HOST=redis
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
