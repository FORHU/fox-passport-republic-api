name: Deploy to EC2 (staging)

# FORHU/fox-passport-republic-api → the staging host in ap-southeast-1.
#
# OIDC instead of static AWS keys, and SSM Run Command instead of SSH: the host
# has no SSH port and no key pair. The container env file travels through
# Parameter Store encrypted, so no secret is baked into an image or committed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy (ignored on push)"
        required: true
        default: main
      image_tag:
        description: "Existing image tag to deploy. Leave blank to build from ref."
        required: false
        default: ""
      run_migrations:
        description: "Run prisma migrate deploy before swapping the container"
        type: boolean
        default: true

concurrency:
  group: foxpassport-staging-deploy # shared with the app: one deploy at a time
  cancel-in-progress: false

env:
  ECR_REPOSITORY: fox-passport-republic-api
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-08f8f2e613ba0e544
  CONTAINER: foxpassport-api
  APP_DIR: /opt/foxpassport
  ENV_PARAM: /foxpassport-staging/api-env
  NODE_ENV: production
  PORT: "3002"

jobs:
  deploy:
    name: Build, Push & Deploy (staging)
    # Native arm64 — the host is t4g. Building on ubuntu-latest produces amd64
    # and the container dies with "exec format error". Do not cross-build via
    # QEMU: pnpm/tsc under emulation looks stuck and can take hours.
    runs-on: ubuntu-24.04-arm
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      # On push there is no `ref` input, so fall back to the pushed commit.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ env.ECR_REPOSITORY }}:$TAG"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: ${{ github.event_name == 'push' || github.event.inputs.image_tag == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # No AWS_ACCESS_KEY / AWS_SECRET_ACCESS_KEY below. The instance role grants
      # S3 and the SDK resolves it from instance metadata. Setting them empty
      # would break that: passing a credentials object makes the SDK skip its
      # provider chain and fail with "Resolved credential object is not valid".
      # Only what is configured today. Anything config.ts declares but nobody
      # has set is deliberately absent rather than written empty: an empty value
      # looks configured and silently disables whatever reads it, which is how
      # three separate features were found broken on the UK stack.
      #
      # Still to add when the devs supply them: EMAIL_FROM,
      # MAILER_TRANSPORT_PORT, MAILER_TRANSPORT_SECURE, RESEND_API_KEY and
      # PLATFORM_FEE_PERCENT — the last one is a marketplace fee, so check what
      # the code does when it is undefined before running real payments.
      - name: Store env file in Parameter Store
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID || secrets.FACEBOOK_APP_ID || '1516141770554323' }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET || 'e8cab5d610b1a46ec0d5ed4b101b2a10' }}
        run: |
          set -euo pipefail
          umask 077

          cat > env.tmp << ENVEOF
          NODE_ENV=${{ env.NODE_ENV }}
          PORT=${{ env.PORT }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          DATABASE_URL=${DATABASE_URL}
          REDIS_HOST=${{ vars.REDIS_HOST }}
          REDIS_PORT=${{ vars.REDIS_PORT }}
          ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
          REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
          SECRET_KEY=${SECRET_KEY}
          AWS_REGION=${{ env.AWS_REGION }}
          AWS_S3_BUCKET=${{ vars.AWS_S3_BUCKET }}
          CLOUD_FRONT_DOMAIN=${{ vars.CLOUD_FRONT_DOMAIN }}
          S3_CDN_URL=${{ vars.S3_CDN_URL }}
          MAILER_EMAIL=${{ vars.MAILER_EMAIL }}
          MAILER_PASSWORD=${MAILER_PASSWORD}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CALLBACK_URL=${{ vars.GOOGLE_CALLBACK_URL }}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
          FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
          FACEBOOK_CALLBACK_URL=${{ vars.FACEBOOK_CALLBACK_URL || 'https://dev.foxpassport.com/api/v1/auth/facebook/callback' }}
          ENVEOF

          aws ssm put-parameter \
            --name "${{ env.ENV_PARAM }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null

          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
          # Empty on a push event, which is not "false", so migrations run by
          # default. A green deploy that silently skipped migrations is how the
          # UK stack accumulated eight of them and 500'd on every chat.
          MIGRATE: ${{ github.event.inputs.run_migrations }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"
          ENVFILE="${{ env.APP_DIR }}/api.env"

          COMMANDS=(
            "set -euo pipefail"
            "mkdir -p ${{ env.APP_DIR }}"
            "aws ssm get-parameter --name ${{ env.ENV_PARAM }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text > ${ENVFILE}"
            "chmod 600 ${ENVFILE}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker pull --platform linux/arm64 ${IMAGE}"
          )

          if [ "${MIGRATE}" != "false" ]; then
            COMMANDS+=("docker run --rm --platform linux/arm64 --network host --entrypoint npx -v ${ENVFILE}:/app/.env:ro ${IMAGE} prisma migrate deploy")
          fi

          COMMANDS+=(
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --env-file ${ENVFILE} -p 127.0.0.1:${{ env.PORT }}:${{ env.PORT }} ${IMAGE}"
            "docker image prune -f"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
