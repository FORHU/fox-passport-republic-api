name: Deploy Dev

# FORHU/fox-passport-republic-api → the shared dev host (ap-southeast-1).
#
# One EC2 instance runs every project's dev environment. This workflow owns
# only its own container; it cannot touch another project's, and the deploy
# role cannot reach any host but this one.
#
# BEFORE THE FIRST RUN
#   1. Repository variable:
#        AWS_DEV_DEPLOY_ROLE_ARN = arn:aws:iam::617163942417:role/forhu-deploy
#      A new name on purpose: AWS_DEPLOY_ROLE_ARN already points at production
#      in several repos, and in gate-closes-api it switches the deploy target.
#   2. Check APP_PORT against this repo's Dockerfile — it is the port the
#      process listens on inside the container. HOST_PORT is allocated per
#      project and must not change; see /etc/caddy/sites/00-PORTS.md.
#   3. Put this project's own secrets in the `dev` environment, and list them
#      in the "Publish project env" step. DATABASE_URL, REDIS_URL and
#      RABBITMQ_URL come from the host — do NOT set them here.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: true
        default: main
  # Uncomment once a dev branch exists and the team wants push-to-deploy.
  # push:
  #   branches: [dev]

concurrency:
  group: forhu-dev-foxpassport
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-0f95a93145ea25e7a
  ECR_REPOSITORY: fox-passport-republic-api
  CONTAINER: foxpassport-api
  NETWORK: forhu-dev
  HOST_PORT: "4011"
  APP_PORT: "3002"
  ENV_PARAM: /forhu-dev/foxpassport/env
  SHARED_ENV: /opt/forhu-dev/credentials/foxpassport.env
  MERGED_ENV: /opt/forhu-dev/foxpassport.env

jobs:
  deploy:
    name: Build and deploy (foxpassport dev)
    # Native arm64: the host is Graviton. An image built on ubuntu-latest is
    # amd64, pulls cleanly, then dies with "exec format error". Do not
    # cross-build under QEMU — Node and Prisma builds take hours and look hung.
    runs-on: ubuntu-24.04-arm
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          # dev- prefix so a dev image can never be mistaken for, or overwrite,
          # a production tag in the same ECR repository.
          echo "tag=dev-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # This project's own config and secrets. DATABASE_URL, REDIS_HOST and
      # REDIS_PORT are deliberately absent: the host supplies them from
      # /opt/forhu-dev/credentials/foxpassport.env and they are merged in at
      # deploy time. Setting them here would point dev at the wrong database.
      #
      # No AWS_ACCESS_KEY / AWS_SECRET_ACCESS_KEY: the instance role grants S3
      # and the SDK resolves it from instance metadata. Passing an empty
      # credentials object makes the SDK skip its provider chain and fail with
      # "Resolved credential object is not valid".
      #
      # Anything unset is omitted rather than written empty — an empty value
      # looks configured and silently disables whatever reads it, which is how
      # Google sign-in was found broken on staging.
      - name: Publish project env to Parameter Store
        env:
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          set -euo pipefail
          umask 077

          cat > env.tmp <<ENVEOF
          NODE_ENV=production
          PORT=${{ env.APP_PORT }}
          AWS_REGION=${{ env.AWS_REGION }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          AWS_S3_BUCKET=${{ vars.AWS_S3_BUCKET }}
          CLOUD_FRONT_DOMAIN=${{ vars.CLOUD_FRONT_DOMAIN }}
          S3_CDN_URL=${{ vars.S3_CDN_URL }}
          MAILER_EMAIL=${{ vars.MAILER_EMAIL }}
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CALLBACK_URL=${{ vars.GOOGLE_CALLBACK_URL }}
          FACEBOOK_APP_ID=${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_CALLBACK_URL=${{ vars.FACEBOOK_CALLBACK_URL }}
          ENVEOF

          for k in ACCESS_TOKEN_SECRET REFRESH_TOKEN_SECRET SECRET_KEY \
                   MAILER_PASSWORD STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
                   GOOGLE_CLIENT_SECRET FACEBOOK_APP_SECRET; do
            v="${!k:-}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> env.tmp
          done

          aws ssm put-parameter \
            --name "${{ env.ENV_PARAM }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            "cat ${{ env.SHARED_ENV }} > ${{ env.MERGED_ENV }}"
            "aws ssm get-parameter --name ${{ env.ENV_PARAM }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text >> ${{ env.MERGED_ENV }}"
            "chmod 600 ${{ env.MERGED_ENV }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform linux/arm64 ${IMAGE}"
            "docker run --rm --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} --entrypoint npx ${IMAGE} prisma migrate deploy"
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} -p 127.0.0.1:${{ env.HOST_PORT }}:${{ env.APP_PORT }} ${IMAGE}"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
