        - name: start_date
          in: query
          schema:
            type: string
          description: "Start date"

        - name: end_date
          in: query
          schema:
            type: string
          description: "End date"

        - name: start_time
          in: query
          schema:
            type: string
          description: "Start time"

        - name: end_time
          in: query
          schema:
            type: string
          description: "End time"

        - name: location
          in: query
          schema:
            type: string
