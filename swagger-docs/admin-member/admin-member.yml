      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        - name: scoped-auth
          in: header
          required: true
          description: Scoped-auth for authorization
          schema:
            type: string
            example: Sample123
        - name: page
          in: query
          required: false
          description: Page number for pagination (default is 1)
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of results per page (default is 10)
          schema:
            type: integer
            example: 10
      responses:
        200:
          description: Sales transaction details fetched successfully
          content:
            application/json:
              schema:
                type: object
