openapi: 3.0.0
info:
  title: Venue4use api
  description: API documentation for venue4use api
  version: ${API_VERSION}
servers:
  - url: ${API_URL}
paths:
  /api/v1/admin/invitation:
    post:
      tags:
        - Admin
      summary: Invite Admin Member
      description: Invite a user to be a member of the admin team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - assigned_roles
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                assigned_roles:
                  type: number
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                  example: 1
      responses:
        200:
          description: Invitation successfully sent to invited admin member
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: response message
                    example: INVITATION_SENT_SUCCESSFULLY
                  data:
                    type: string
                    description: token with invited user data
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        400:
          description: Bad request, invalid credentials
        500:
          description: Server error

  /api/v1/admin/accept/{token}:
    post:
      tags:
        - Admin
      summary: Accept Admin Invitation
      description: User accepts the invitation sent by admin
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
        - name: scoped-auth
          in: header
          required: true
          description: scoped-auth for authorization
          schema:
            type: string
            example: "Sample123"
        - name: token
          in: query
          required: true
          description: token with invited user data
          schema:
            type: string
            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - phone_number
                - password
              properties:
                first_name:
                  type: string
                  description: User's first name
                  example: "John"
                last_name:
                  type: string
                  description: User's last name
                  example: "Doe"
                phone_number:
                  type: string
                  description: User's phone number
                  example: "+1234567890"
                password:
                  type: string
                  description: User's password for account setup
                  example: "securePassword123"
      responses:
        200:
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invitation accepted successfully."
        400:
          description: Bad Request (Invalid or missing parameters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "BAD_REQUEST"
                  error:
                    type: string
                    example: "Invalid or missing parameters."
        401:
          description: Unauthorized (Invalid or missing authentication token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "UNAUTHORIZED"
                  error:
                    type: string
                    example: "Missing or invalid authorization token."
        404:
          description: Not Found (Invitation token not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "NOT_FOUND"
                  error:
                    type: string
                    example: "Invitation token not found."
        500:
          description: Internal Server Error (Unexpected server error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "INTERNAL_SERVER_ERROR"
                  error:
                    type: string
                    example: "An unexpected error occurred on the server."

  /api/v1/admin/members:
    get:
      tags:
        - Admin
      summary: Fetch Admin Members
      description: Fetch admin members based on status, assigned roles, and optional search filters.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        - name: scoped-auth
          in: header
          required: true
          description: scoped-auth for authorization
          schema:
            type: string
            example: Sample123
        - name: status
          in: query
          required: false
          description: Status filter for the admin members
          schema:
            type: string
            example: "ACCEPTED"
        - name: assigned_roles
          in: query
          required: false
          description: Comma-separated list of assigned role IDs
          schema:
            type: string
            example: "1,2,3"
        - name: search
          in: query
          required: false
          description: Search term for filtering members by name, phone number, or email
          schema:
            type: string
            example: "Jane"
        - name: page
          in: query
          required: false
          description: Page number for pagination (default is 1)
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of results per page (default is 10)
          schema:
            type: integer
            example: 10
      responses:
        200:
          description: Successful retrieval of admin members
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Response message
                    example: ADMIN_MEMBERS_FETCHED_SUCCESSFULLY
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "6715e3a07835548ddf606667"
                        admin:
                          type: string
                          example: "6715ae62efdafa7706e50f1d"
                        invited_user:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "6715e3a07835548ddf606666"
                            first_name:
                              type: string
                              example: "Jane"
                            last_name:
                              type: string
                              example: "Admin"
                            phone_number:
                              type: string
                              example: "+6554564677"
                            date_of_birth:
                              type: string
                              nullable: true
                              example: null
                            profile_picture:
                              type: string
                              nullable: true
                              example: null
                            origin:
                              type: string
                              example: "EMAIL"
                            company_name:
                              type: string
                              nullable: true
                              example: null
                            country:
                              type: string
                              example: "SG"
                            zip_code:
                              type: string
                              nullable: true
                              example: null
                            email:
                              type: string
                              format: email
                              example: "vouddeuprevoppo-6077@yopmail.com"
                            username:
                              type: string
                              nullable: true
                              example: null
                            password:
                              type: string
                              example: "hashedpassword"
                            role:
                              type: string
                              example: "ADMIN"
                            status:
                              type: string
                              example: "ACTIVE"
                            organization:
                              type: string
                              nullable: true
                              example: null
                            social_link:
                              type: string
                              example: ""
                            postal:
                              type: string
                              nullable: true
                              example: null
                            createdAt:
                              type: string
                              format: date-time
                              example: "2024-10-21T05:16:16.764Z"
                            updatedAt:
                              type: string
                              format: date-time
                              example: "2024-10-21T05:17:14.015Z"
                            deletedAt:
                              type: string
                              nullable: true
                              format: date-time
                              example: null
                            deletedBy:
                              type: string
                              nullable: true
                              example: null
                        acl:
                          type: string
                          nullable: true
                          example: null
                        status:
                          type: string
                          example: "ACCEPTED"
                        suspension_time:
                          type: string
                          nullable: true
                          format: date-time
                          example: null
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-10-21T05:16:16.785Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2024-11-08T08:19:15.973Z"
                        deletedAt:
                          type: string
                          nullable: true
                          format: date-time
                          example: null
                        deletedBy:
                          type: string
                          nullable: true
                          example: null
                        venues:
                          type: array
                          items:
                            type: object
                            properties:
                              _id:
                                type: string
                                example: "672dc1d8db2583353ebc32b3"
                              user:
                                type: string
                                example: "672dc173db2583353ebc32af"
                              name:
                                type: string
                                example: "hello"
                              representation:
                                type: string
                                nullable: true
                                example: null
                              description:
                                type: string
                                example: "test test test..."
                              address:
                                type: object
                                properties:
                                  street:
                                    type: string
                                    example: "Jardine Davies Building"
                                  city:
                                    type: string
                                    example: "Makati City"
                                  state:
                                    type: string
                                    example: "Metro Manila"
                                  country:
                                    type: string
                                    example: "PH"
                                  postal_code:
                                    type: string
                                    example: "4011"
                                  coordinates:
                                    type: object
                                    properties:
                                      latitude:
                                        type: number
                                        format: float
                                        example: 14.558997
                                      longitude:
                                        type: number
                                        format: float
                                        example: 121.010539
                              keywords:
                                type: array
                                items:
                                  type: string
                                example: ["672044384f835fc9e1ed6dfc", "67203c3b4f835fc9e1ed6ced"]
                              cancellation_policy:
                                type: string
                                nullable: true
                                example: null
                              status:
                                type: string
                                example: "DRAFT"
                              foods_and_beverages:
                                type: array
                                items:
                                  type: string
                                example: []
                              form_steps:
                                type: number
                                example: 3
                              organization:
                                type: string
                                example: "672dc173db2583353ebc32ae"
                              age_restriction:
                                type: string
                                nullable: true
                                example: null
                              commission:
                                type: number
                                format: float
                                example: 0.15
                              rebate:
                                type: string
                                nullable: true
                                example: null
                              payment_method:
                                type: string
                                nullable: true
                                example: null
                              is_extracted:
                                type: boolean
                                example: false
                              createdAt:
                                type: string
                                format: date-time
                                example: "2024-11-08T07:46:32.214Z"
                              updatedAt:
                                type: string
                                format: date-time
                                example: "2024-11-08T08:24:43.280Z"
                              deletedAt:
                                type: string
                                nullable: true
                                format: date-time
                                example: null
                              deletedBy:
                                type: string
                                nullable: true
                                example: null
                              updatedBy:
                                type: string
                                nullable: true
                                example: null
                        assigned_roles:
                          type: array
                          items:
                            type: number
                          example: [2]
        400:
          description: Bad request, invalid parameters
        500:
          description: Server error

  /api/v1/admin/member/{id_update}:
    patch:
      tags:
        - Admin
      summary: Update Admin Member
      description: Update admin members based on status, assigned roles, and optional search filters.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        - name: scoped-auth
          in: header
          required: true
          description: Scoped-auth for authorization
          schema:
            type: string
            example: Sample123
        - name: id
          in: path
          required: true
          description: ID of the admin member to update
          schema:
            type: string
            example: 672dc173db2583353ebc32ae
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_roles:
                  type: number
                  description: Designated role for the invited member
                  example: 1
                venues:
                  type: array
                  items:
                    type: string
                  description: Array of Venue IDs for the invited member
                  example: ["672dc1d8db2583353ebc32b3", "672dc1d8db2583353ebc32b4"]
                suspension_time:
                  type: string
                  enum:
                    - "1"
                    - "6"
                    - "12"
                    - "24"
                    - "UNTIL_UNSUSPENDED"
                    - "REMOVE_SUSPENSION"
      responses:
        200:
          description: Admin member updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ADMIN_MEMBER_UPDATED_SUCCESSFULLY"
                  data:
                    type: object
                    properties:
                      acknowledged:
                        type: boolean
                        example: true
                      modifiedCount:
                        type: integer
                        example: 1
                      upsertedId:
                        type: string
                        nullable: true
                        example: null
                      upsertedCount:
                        type: integer
                        example: 0
                      matchedCount:
                        type: integer
                        example: 1
        400:
          description: Bad Request (Invalid or missing parameters or fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "BAD_REQUEST"
                  error:
                    type: string
                    example: "Invalid ID or malformed request body."
        401:
          description: Unauthorized (Invalid or missing authentication token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "UNAUTHORIZED"
                  error:
                    type: string
                    example: "Missing or invalid authorization token."
        403:
          description: Forbidden (The user does not have permission to access this resource)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "FORBIDDEN"
                  error:
                    type: string
                    example: "You do not have permission to access this resource."
        404:
          description: Not Found (The requested resource could not be found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "NOT_FOUND"
                  error:
                    type: string
                    example: "The requested resource does not exist."
        500:
          description: Internal Server Error (An unexpected error occurred on the server)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "INTERNAL_SERVER_ERROR"
                  error:
                    type: string
                    example: "An unexpected error occurred on the server."

