      summary: Fetch All Relative Enquiries
      description: Fetch enquiries aligned with filter or query provided
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        - name: scoped-auth
          in: header
          required: true
          description: scoped-auth for authorization
          schema:
            type: string
            example: Sample123
        - name: space_id
          in: query
          required: false
          description: ID of the space to filter enquiries by
          schema:
            type: string
        - name: venue_id
          in: query
          required: false
          description: ID of the venue to filter enquiries by
          schema:
            type: string
        - name: venues
          in: query
          required: false
          description: List of venue IDs to filter enquiries by
          schema:
            type: array
            items:
              type: string
            example: ["609e1234567890abcdef1234", "609e1234567890abcdef5678"]
        - name: enquiry_id
          in: query
          required: false
          description: ID of a specific enquiry to retrieve
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Status of the enquiry (can be a comma-separated list)
          schema:
            type: string
            example: "PENDING,CONFIRMED"
        - name: toggle_censor
          in: query
          required: false
          description: Toggle to censor sensitive information (phone numbers)
          schema:
            type: string
            enum: ["true", "false"]
            example: "true"
        - name: toggle_current
          in: query
          required: false
